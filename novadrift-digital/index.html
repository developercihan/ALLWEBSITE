    <script>
      /**
       * Early defensive guard for window.fetch.
       * Some environments (like iFrames or certain proxies) define window.fetch as a read-only getter.
       * This script attempts to make it writable before other scripts (like polyfills) try to assign to it.
       */
      (function() {
        try {
          const target = window;
          const desc = Object.getOwnPropertyDescriptor(target, 'fetch') || 
                       Object.getOwnPropertyDescriptor(Object.getPrototypeOf(target), 'fetch');
          
          if (desc && (!desc.writable || desc.set === undefined) && desc.configurable !== false) {
            const originalFetch = target.fetch;
            let currentFetch = originalFetch;
            Object.defineProperty(target, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return currentFetch; },
              set: function(v) { currentFetch = v; }
            });
          }
        } catch (e) {
          console.warn('Fetch guard could not be applied:', e.message);
        }

        // Global error sink for the "fetch only has a getter" error which can crash some frameworks
        window.addEventListener('error', function(event) {
          if (event.message && (
            event.message.includes('property fetch') || 
            event.message.includes('only a getter')
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
